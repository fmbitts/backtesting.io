[project]
name = "milho"
version = "0.1.0"
description = "Python-based algorithmic trading project focused on corn futures analysis and backtesting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.3",
    "pyarrow>=19.0.1",
    "backtesting>=0.6.2",
    "ta>=0.11.0",
    "matplotlib>=3.10.1",
    "numpy>=2.2.3",
    "ta-lib>=0.6.4",
    "yfinance>=0.2.65",
    "jupyter>=1.0.0",
    "jupyterlab>=4.3.6",
]
